# NOTE: PostgreSQL is used on purpose. The task requires a REAL unique index in the
# database so that e-mail uniqueness is guaranteed by the storage engine even when
# several processes/sources write at the same time. SQLite would also do it, but
# PostgreSQL gives us proper concurrent-write behaviour and row level locking.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", ENV["USER"]) %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>
  variables:
    statement_timeout: 15000

development:
  <<: *default
  database: user_management_development

test:
  <<: *default
  database: user_management_test

production:
  # IMPORTANT: the two branches must NOT be mixed.
  #
  # A platform (Render, Heroku, Fly.io) gives the whole connection as ONE url -
  # it carries the host, the port, the user, the password and the name of the
  # database. When the discrete variables are merged into the same block, they
  # OVERRIDE the values of the url and the application connects to the local
  # database instead (the error "connection to server at 127.0.0.1, port 5432
  # failed").
  <% if ENV["DATABASE_URL"].present? %>
  # NOTE: the url of the platform - nothing else.
  url: <%= ENV["DATABASE_URL"] %>
  <% else %>
  # NOTE: the local installation - the discrete variables (and the local
  # PostgreSQL of this machine).
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "user_management_production") %>
  <% end %>
