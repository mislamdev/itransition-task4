# =============================================================================
# THE BLUEPRINT FOR RENDER (render.yaml)
# -----------------------------------------------------------------------------
# It creates the whole deployment with one click:
#   1. a PostgreSQL database (the unique index needs a real database),
#   2. a web service that runs the application.
#
# HOW TO USE IT
#   1. push the repository to GitHub,
#   2. in Render: "New" -> "Blueprint" -> select the repository -> "Apply",
#   3. Render builds the application, runs the migrations and starts it.
#
# IMPORTANT: the secret key of the environment is generated by Render
# (`generate: true`) - it is NOT in the repository (the repository is public).
#
# NOTE: the FREE plan has no "pre-deploy command" - therefore the migrations
# are part of the start command (see below). The free plan also puts the
# service to sleep after 15 minutes without a request, and the free database
# expires after 30 days.
# =============================================================================

databases:
  - name: user-management-db
    databaseName: user_management
    user: user_management
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: user-management
    runtime: ruby
    plan: free
    region: oregon

    # NOTE: the branch that is deployed.
    branch: main

    # NOTE: Render reads the version of Ruby from the .ruby-version file - this
    # line makes it explicit and keeps the build reproducible.
    envVars:
      - key: RUBY_VERSION
        value: 3.4.2

      # NOTE: the secret key of the sessions - Render generates it.
      - key: SECRET_KEY_BASE
        generateValue: true

      # NOTE: the connection string of the database below. IMPORTANT: it is
      # declared explicitly, so that it cannot be missed - without it the
      # application would try to connect to the local database.
      - key: DATABASE_URL
        fromDatabase:
          name: user-management-db
          property: connectionString

      # NOTE: the proxy of Render terminates the TLS and sends the header
      # `X-Forwarded-Proto: https` - the application has to know that.
      - key: ASSUME_SSL
        value: "true"

      # NOTE: the proxy of Render does the redirect to HTTPS itself.
      - key: FORCE_SSL
        value: "false"

      # NOTE: the assets are served by the application.
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"

      # NOTE: the log level of the platform.
      - key: RAILS_LOG_LEVEL
        value: info

      # NOTE: the master key of the credentials is NOT in the repository - the
      # application does not need it (the secret comes from SECRET_KEY_BASE).

    # NOTE: the build - the gems and the assets.
    buildCommand: bundle install && bin/rails assets:precompile

    # NOTE: the start - the migrations run BEFORE the server starts.
    #
    # IMPORTANT: Render offers a "pre-deploy command" only in the paid plans,
    # therefore the migrations are part of the start command. `db:prepare`
    # creates the database and loads the schema at the first deployment (and it
    # fills the demo data), afterwards it only runs the migrations - so the
    # unique index is always in place before the application answers.
    startCommand: bin/rails db:prepare && bundle exec puma -C config/puma.rb

    # NOTE: the health check - the root of the application redirects to the
    # login form, therefore the check uses the health endpoint of Rails.
    healthCheckPath: /up

    # NOTE: the database of the service - the link adds DATABASE_URL to the
    # environment of the service.
    database:
      name: user-management-db
